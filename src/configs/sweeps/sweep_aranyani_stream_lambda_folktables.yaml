# Aranyani pre-trained exactly like FADO (lambda_base = 0.1), then streamed with a
# fixed lambda = 0.5 (>= FADO's whole-stream mean lambda on folktables, Table III).
#
# Isolates what FADO adds: same starting forest as FADO (pre-training is
# deterministic per seed, so the checkpoint is identical), and during streaming
# a constant lambda of at least FADO's average versus FADO's adaptive lambda_t.
# sweep_aranyani_matched_lambda_folktables.yaml instead pre-trains at lambda = 0.5
# too (a practitioner's fixed-lambda baseline), which gives Aranyani a fairer
# starting forest than FADO had.
#
# Same seeds and subsample as the paper runs; pairs by seed with the existing FADO runs.
program: src/main.py
project: fado-ablations
method: grid
name: aranyani-stream-lambda-folktables
metric:
  name: aranyani/stream_final_dp
  goal: minimize
parameters:
  pipeline_model:
    value: 'aranyani'
  pipeline_dataset:
    value: folktables
  folktables_subsample_fraction:
    value: 0.1
  lambda_const:
    value: 0.5
  pretrain_lambda_const:
    value: 0.1
  seeds:
    values: ['66', '77', '88', '99', '101', '111', '122', '133', '144', '155', '166', '177', '188', '199', '202', '213', '224', '235', '246', '257', '268', '279', '291', '303', '314', '325', '336', '347', '358', '369']
  deterministic:
    value: true
  wandb_log:
    value: true
  wandb_project:
    value: fado-ablations
command:
  - ${env}
  - PYTHONHASHSEED=0
  - ${interpreter}
  - -m
  - src.main
  - ${args}
