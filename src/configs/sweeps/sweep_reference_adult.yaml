# ARF / RFR reference points for the lambda trade-off plot (adult).
#
# They have no fairness lambda, so they run once per scenario on the same
# tuning seeds. Scenarios: the 4 abrupt injected-drift scenarios (gradual ones double an already long sweep).
#
# 4 run(s), 5 tuning seeds each.
program: src/main.py
project: fado-ablations
method: grid
name: reference-adult
metric:
  name: arf/stream_final_dp
  goal: minimize
parameters:
  pipeline_model:
    value: 'arf,rfr'
  pipeline_dataset:
    value: adult
  drift_scenario:
    values:
      - sim_x_permutations
      - sim_y_swaps
      - sim_y_prior_skip
      - sim_x_exceed_skip
  seeds:
    value: '11,22,33,44,55'
  deterministic:
    value: true
  wandb_log:
    value: true
  wandb_project:
    value: fado-ablations
command:
  - ${env}
  - PYTHONHASHSEED=0
  - ${interpreter}
  - -m
  - src.main
  - ${args}
