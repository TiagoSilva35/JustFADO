# Decision log 3.2: equal lambda budget, reported as trade-off curves (compas).
#
# Both arms run on the SAME lambda grid, paired on one pre-trained forest per
# cell. No lambda is selected: plot each arm's accuracy-vs-DP curve with
# python -m src.plot_lambda_tradeoff. Scenarios: all 8 injected-drift scenarios.
#
# 7 lambdas x 8 scenario(s) = 56 runs, 5 tuning seeds each.
program: src/main.py
project: fado-ablations
method: grid
name: lambda-budget-compas
metric:
  name: aranyani_base/stream_final_dp
  goal: minimize
parameters:
  pipeline_model:
    value: 'aranyani,aranyani_base'
  pipeline_dataset:
    value: compas
  drift_scenario:
    values:
      - sim_x_permutations
      - sim_x_permutations_gradual
      - sim_y_swaps
      - sim_y_swaps_gradual
      - sim_y_prior_skip
      - sim_y_prior_skip_gradual
      - sim_x_exceed_skip
      - sim_x_exceed_skip_gradual
  lambda_const:
    values: [0.01, 0.03, 0.1, 0.3, 1.0, 3.0, 10.0]
  seeds:
    value: '11,22,33,44,55'
  deterministic:
    value: true
  wandb_log:
    value: true
  wandb_project:
    value: fado-ablations
command:
  - ${env}
  - PYTHONHASHSEED=0
  - ${interpreter}
  - -m
  - src.main
  - ${args}
