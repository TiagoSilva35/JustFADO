# Component ablation on Folktables, the same three arms as sweep_ablation_adult.yaml, so the
# ablation table covers both datasets with one set of arms.
#
# Not re-run: full FADO, FADO without the adaptive constraint (fado_no_lambda) and Aranyani
# come from the main Folktables sweep (jo5dqqhy), same seeds and streams.
#
# 30 runs, 3 arms each (~21 min per arm on tesla).
program: src/main.py
project: fado-ablations
method: grid
name: ablation-folktables
metric:
  name: fado_dual/stream_final_dp
  goal: minimize
parameters:
  pipeline_model:
    value: 'fado_dual,fado_lambda_only,fado_no_reset'
  pipeline_dataset:
    value: folktables
  folktables_subsample_fraction:
    value: 0.1   # as in the main sweep: ~18.7k train + ~18.7k stream
  seeds:
    values: ['66', '77', '88', '99', '101', '111', '122', '133', '144', '155', '166', '177', '188', '199', '202', '213', '224', '235', '246', '257', '268', '279', '291', '303', '314', '325', '336', '347', '358', '369']
  pretrain_cache_dir:
    value: files/pretrain_cache   # pre-train each seed once per machine (TESTS/check_pretrain_cache.py)
  deterministic:
    value: true
  wandb_log:
    value: true
  wandb_project:
    value: fado-ablations
command:
  - ${env}
  - PYTHONHASHSEED=0
  - ${interpreter}
  - -m
  - src.main
  - ${args}
