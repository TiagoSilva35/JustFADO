# Aranyani with a stronger, fixed lambda on Adult: is FADO still fairer when the
# baseline gets at least FADO's average fairness weight?
#
# lambda_const = 1.5 >= FADO's whole-stream mean lambda in every Adult scenario
# (0.94 - 1.47, Table III; default lambda_base = 0.1). One value for the dataset,
# rounded up, rather than one per scenario, so the baseline is not tuned on the
# results. Aranyani also pre-trains with this lambda.
#
# Same 4 scenarios and 30 reporting seeds as the paper runs (sweeps uwhcwsdg,
# bi6frxi3, l8c4i60o): each run pairs by seed with the existing FADO run.
# 4 scenarios x 30 seeds = 120 runs, Aranyani only (~25 min each).
program: src/main.py
project: fado-ablations
method: grid
name: aranyani-matched-lambda-adult
metric:
  name: aranyani/stream_final_dp
  goal: minimize
parameters:
  pipeline_model:
    value: 'aranyani'
  pipeline_dataset:
    value: adult
  lambda_const:
    value: 1.5
  drift_scenario:
    values:
      - sim_x_permutations
      - sim_y_swaps
      - sim_y_prior_skip
      - sim_x_exceed_skip
  seeds:
    values: ['66', '77', '88', '99', '101', '111', '122', '133', '144', '155', '166', '177', '188', '199', '202', '213', '224', '235', '246', '257', '268', '279', '291', '303', '314', '325', '336', '347', '358', '369']
  deterministic:
    value: true
  wandb_log:
    value: true
  wandb_project:
    value: fado-ablations
command:
  - ${env}
  - PYTHONHASHSEED=0
  - ${interpreter}
  - -m
  - src.main
  - ${args}
