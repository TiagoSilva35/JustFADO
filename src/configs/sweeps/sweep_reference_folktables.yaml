# ARF / RFR reference points for the lambda trade-off plot (folktables).
#
# They have no fairness lambda, so they run once per scenario on the same
# tuning seeds. Scenarios: natural drift: train on 2015, stream 2017 then 2018 (10% subsample).
#
# 1 run(s), 5 tuning seeds each.
program: src/main.py
project: fado-ablations
method: grid
name: reference-folktables
metric:
  name: arf/stream_final_dp
  goal: minimize
parameters:
  pipeline_model:
    value: 'arf,rfr'
  pipeline_dataset:
    value: folktables
  folktables_subsample_fraction:
    value: 0.1   # ~18.7k train + ~18.7k stream (full CA is 187k + 187k)
  seeds:
    value: '11,22,33,44,55'
  deterministic:
    value: true
  wandb_log:
    value: true
  wandb_project:
    value: fado-ablations
command:
  - ${env}
  - PYTHONHASHSEED=0
  - ${interpreter}
  - -m
  - src.main
  - ${args}
