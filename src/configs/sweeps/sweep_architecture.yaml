# Forest size: does the FADO-over-Base gap survive changes in depth and tree
# count, or is it specific to the default depth=4, num_trees=3?
#
# Replaces files/wandb_tree_depth_sweep.yaml (single arm, accuracy only,
# Windows interpreter path). Both arms run so the metric is the paired
# delta_dp; accuracy is logged alongside.
#
# Depth stops at 7: per-sample cost grows with 2^depth and the prequential
# loop is batch-size-1. Add 8-9 only if the trend at 7 asks for it.
#
# 5 depths x 3 tree counts = 15 runs, 5 tuning seeds each.
program: src/main.py
project: fado-ablations
method: grid
name: architecture
metric:
  name: delta_dp
  goal: maximize
parameters:
  pipeline_model:
    value: 'aranyani,aranyani_base'
  pipeline_dataset:
    value: compas
  drift_scenario:
    value: abrupt_race
  depth:
    values: [3, 4, 5, 6, 7]
  num_trees:
    values: [1, 3, 5]
  seeds:
    value: '11,22,33,44,55'
  deterministic:
    value: true
  wandb_log:
    value: true
  wandb_project:
    value: fado-ablations
command:
  - ${env}
  - PYTHONHASHSEED=0
  - ${interpreter}
  - -m
  - src.main
  - ${args}
