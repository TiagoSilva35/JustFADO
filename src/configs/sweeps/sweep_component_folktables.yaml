# Which components of the reaction controller contribute? (folktables)
#
# Grid over the nine controller presets on natural drift: train on 2015, stream 2017 then 2018 (10% subsample).
# Every arm runs with identical hyperparameters; only the enabled components
# differ. Each run evaluates the preset and aranyani on one pre-trained
# forest, and the metric is their paired difference.
#
# 9 presets x 1 scenario(s) = 9 runs, 5 tuning seeds each.
program: src/main.py
project: fado-ablations
method: grid
name: component-folktables
metric:
  name: delta_dp
  goal: maximize
parameters:
  pipeline_model:
    values:
      - 'fado,aranyani'                 # full controller
      - 'fado_no_lambda,aranyani'       # FADO before 2.1: lambda fixed
      - 'fado_lambda_only,aranyani'     # lambda controller, no LR/temp
      - 'fado_no_reset,aranyani'        # - fairness-stat reset on drift
      - 'fado_no_lr,aranyani'           # - LR reaction, - prewarm
      - 'fado_no_temp,aranyani'         # - temperature reaction
      - 'fado_no_prewarm,aranyani'      # - warning stage
      - 'fado_no_noise_guard,aranyani'  # - label-noise guard
      - 'fado_detect_only,aranyani'     # detects, reacts to nothing
  pipeline_dataset:
    value: folktables
  folktables_subsample_fraction:
    value: 0.1   # ~18.7k train + ~18.7k stream (full CA is 187k + 187k)
  seeds:
    value: '11,22,33,44,55'
  deterministic:
    value: true
  wandb_log:
    value: true
  wandb_project:
    value: fado-ablations
command:
  - ${env}
  - PYTHONHASHSEED=0
  - ${interpreter}
  - -m
  - src.main
  - ${args}
