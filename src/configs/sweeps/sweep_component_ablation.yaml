# Which components of the reaction controller actually contribute?
#
# Grid, not bayes: this is an ablation table, not a search. Every arm runs with
# IDENTICAL hyperparameters; the only thing that varies is which component is
# enabled. Each run evaluates the treatment arm and aranyani_base together and
# the metric is the paired difference, so scenario and seed effects cancel.
#
# Tuning split only (seeds 11-55). Re-run the winner on the reporting seeds.
program: src/main.py
method: grid
name: fado-component-ablation
metric:
  name: delta_dp          # baseline DP minus treatment DP; positive = fairer
  goal: maximize
parameters:
  pipeline_model:
    values:
      - 'aranyani,aranyani_base'            # full controller
      - 'fado_lr_only,aranyani_base'        # - temperature reaction
      - 'fado_temp_only,aranyani_base'      # - LR reaction, - prewarm
      - 'fado_no_prewarm,aranyani_base'     # - warning stage
      - 'fado_no_noise_guard,aranyani_base' # - label-noise guard
      - 'fado_detect_only,aranyani_base'    # detects, reacts to nothing
  pipeline_dataset:
    values: ['compas', 'adult']
  drift_scenario:
    values: ['abrupt_race', 'gradual_race']
  seeds:
    values: ['11,22,33,44,55']
  run_seed_pipeline:
    values: [true]
  run_all_scenarios:
    values: [false]
  deterministic:
    values: [true]
  wandb_log:
    values: [true]
command:
  - ${env}
  - python
  - ${program}
  - ${args}
