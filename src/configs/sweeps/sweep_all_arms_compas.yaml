# Every arm on every drift of this dataset (compas): the main results table.
#
# all 8 injected-drift scenarios. The drift is a property of the data, so by the budget rule every
# arm runs on it: FADO, FADO without the lambda controller, Base, ARF, RFR.
#
# 8 run(s), 5 tuning seeds each.
program: src/main.py
project: fado-ablations
method: grid
name: all-arms-compas
metric:
  name: delta_dp
  goal: maximize
parameters:
  pipeline_model:
    value: 'fado,fado_no_lambda,aranyani,arf,rfr'
  pipeline_dataset:
    value: compas
  drift_scenario:
    values:
      - sim_x_permutations
      - sim_x_permutations_gradual
      - sim_y_swaps
      - sim_y_swaps_gradual
      - sim_y_prior_skip
      - sim_y_prior_skip_gradual
      - sim_x_exceed_skip
      - sim_x_exceed_skip_gradual
  seeds:
    value: '11,22,33,44,55'
  deterministic:
    value: true
  wandb_log:
    value: true
  wandb_project:
    value: fado-ablations
command:
  - ${env}
  - PYTHONHASHSEED=0
  - ${interpreter}
  - -m
  - src.main
  - ${args}
